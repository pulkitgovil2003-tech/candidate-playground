<!DOCTYPE html>
<html>
<head>
    <title>Candidate Playground</title>
</head>
<body>
    <h1>My Profile</h1>
     <div id="profile">Loading profile...</div>

    <h2>Projects</h2>
    <button onclick="loadProjects()">Load Projects</button>
    <pre id="projects"></pre>

    <h2>Search</h2>
    <input id="q" placeholder="search projects">
    <button onclick="search()">Search</button>
    <pre id="results"></pre>
    <h3 id="health">Checking backend...</h3>
<script>
const API_BASE = "https://candidate-playground-gqa9.onrender.com";
fetch(`${API_BASE}/health`)
  .then(res => {
    if (!res.ok) throw new Error("Health check failed");
    return res.json();
  })
  .then(data => {
    document.getElementById("health").innerText =
      "Backend Status: " + data.status;
  })
  .catch(err => {
    document.getElementById("health").innerText =
      "Backend Status:  unreachable";
    console.error(err);
  });

fetch(`${API_BASE}/profile`)
  .then(res => res.json())
  .then(profile => {
    document.getElementById("profile").innerHTML = `
      <p><b>Name:</b> ${profile.name}</p>
      <p><b>Email:</b> ${profile.email}</p>
      <p><b>Education:</b> ${profile.education}</p>
      <p>
        <a href="${profile.github}" target="_blank">GitHub</a> |
        <a href="${profile.linkedin}" target="_blank">LinkedIn</a> |
        <a href="${profile.portfolio}" target="_blank">Portfolio</a>
      </p>
    `;
  });


function loadProjects() {
  fetch(`${API_BASE}/projects`)
    .then(res => res.json())
    .then(data => {
      document.getElementById("projects").innerText =
        JSON.stringify(data, null, 2);
    });
}

function search() {
  const q = document.getElementById("q").value;
  fetch(`${API_BASE}/search?q=${q}`)
    .then(res => res.json())
    .then(data => {
      document.getElementById("results").innerText =
        JSON.stringify(data, null, 2);
    });
}
</script>
</body>
</html>
